version: "2"
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
  settings:
    errcheck:
      # Three families of call whose error this codebase deliberately does not
      # check, each for its own reason. Listed by name rather than suppressed
      # wholesale, so a fourth family has to be argued for the same way.
      exclude-functions:
        # A deferred Rollback after a successful Commit returns sql.ErrTxDone
        # by design — that is how the idiom works, and checking it means
        # writing a branch for the happy path. The rollback that matters is
        # the one on the error path, which is the return the caller sees.
        - (*database/sql.Tx).Rollback
        # rows.Close's error is already reported by rows.Err(), which every
        # read in internal/store checks after the loop — see streamRows, whose
        # whole point is that a truncated read cannot look complete.
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        # Writing to a destination that has already been given up on. For
        # fmt.Fprint* the destination is either os.Stderr — where a failure
        # cannot be reported, since reporting it is what just failed — or an
        # http.ResponseWriter whose status has already been sent, which
        # internal/web/live.go explains at the one place it matters. errcheck
        # excludes fmt.Print* by default on the same reasoning; these are the
        # same calls with the writer named.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # A Win32 call's third return is the calling thread's last-error value,
        # not a report about this call. Win32's own contract is that the return
        # value says whether the call failed and the last error is meaningful
        # only then — so checking it unconditionally reports a stale success as
        # a failure. internal/tray captures it exactly where the return value
        # says something went wrong (registering the class, creating the window,
        # adding the icon) and nowhere else.
        - (*golang.org/x/sys/windows.LazyProc).Call
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      # SA1008 objects to non-canonical http.Header keys. Throughout wb they are
      # the requirement, not a slip: the site's gate headers travel lowercase on
      # the wire, and net/http's canonicalisation into Deviceid and X-Queryid is
      # precisely what wb/headers.go exists to avoid. Anything asserting on those
      # headers has to name them the same way, which is the only way to prove the
      # canonicalisation did not happen — so the exclusion covers the package
      # rather than the one file that first needed it.
      - path: wb/.*\.go
        linters:
          - staticcheck
        text: SA1008
formatters:
  enable:
    - gofmt
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
